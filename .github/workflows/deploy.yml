name: CI
permissions:
  contents: read

on:
  push:
    branches: [ feature/login ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # (선택) local.properties 생성
      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties

      # 디버그용: 구조 확인
      - name: Debug directory structure
        run: |
          pwd
          ls -al
          ls -al android
          ls -al android/gradle/wrapper || true

      # 핵심: android 디렉터리에서 gradlew 실행
      - name: Build Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
