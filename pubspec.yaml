name: cultureyo
description: A regional event matching Flutter application.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  socket_io_client: ^2.0.3 # 최신 버전을 확인하고 추가
  
  url_launcher: ^6.3.0
  html_unescape: ^2.0.0
  http: ^1.2.1 # 최신 버전으로 명시
  flutter_dotenv: ^5.1.0
  kakao_flutter_sdk: ^1.9.7+3 # 전체 추가
  flutter_naver_login: ^2.1.1  # (현재 pub.dev 최신 안정 버전)
  provider: ^6.1.2  # ✅ 이 줄 추가 (현재 최신 버전)

  flutter_secure_storage: ^9.0.0

  # State management
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3

  # Network
  dio: ^5.3.2
  retrofit: ^4.0.3
  json_annotation: ^4.8.1


  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Location & Maps
  geolocator: ^10.1.0
  permission_handler: ^11.0.1

  # Utils
  intl: ^0.18.1
  equatable: ^2.0.5
  get_it: ^7.6.4
  flutter_map: ^8.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

  # Code generation
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^3.0.1

  # Testing
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logos/Culture.png
    - assets/images/icons/kakao_icon.png
    - assets/images/icons/naver_icon.png
    - .env

flutter_launcher_icons:
  # 사용할 이미지 파일 경로 (1단계에서 저장한 경로)
  image_path: "assets/images/icons/cultureyo_icon.jpg"

  # 아이콘을 적용할 플랫폼 지정 (기본적으로 모두 true)
  android: true